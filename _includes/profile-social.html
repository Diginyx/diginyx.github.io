<!-- Social links under the profile photo, in the original footer icon style, inverting on hover like the CV/Resume buttons -->
<div class="profile-social-btns">
  {% if site.email %}<a class="profile-icon-btn" href="mailto:{{ site.email }}" aria-label="Email" title="Email"><i class="fas fa-envelope-square"></i></a>{% endif %}
  {% if site.scholar_id %}<a class="profile-icon-btn" href="https://scholar.google.com/citations?user={{ site.scholar_id }}&hl=en" target="_blank" rel="noopener noreferrer" aria-label="Google Scholar" title="Google Scholar"><i class="ai ai-google-scholar-square"></i></a>{% endif %}
  {% if site.linkedin %}<a class="profile-icon-btn" href="https://www.linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn"><i class="fab fa-linkedin"></i></a>{% endif %}
  {% if site.github %}<a class="profile-icon-btn" href="https://github.com/{{ site.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><i class="fab fa-github-square"></i></a>{% endif %}
  {% if site.twitter %}<a class="profile-icon-btn" href="https://twitter.com/{{ site.twitter }}" target="_blank" rel="noopener noreferrer" aria-label="Twitter" title="Twitter"><i class="fab fa-twitter-square"></i></a>{% endif %}
  {% if site.orcid %}<a class="profile-icon-btn" href="https://orcid.org/{{ site.orcid }}" target="_blank" rel="noopener noreferrer" aria-label="ORCID" title="ORCID"><i class="ai ai-orcid-square"></i></a>{% endif %}
  {% if site.arxiv %}<a class="profile-icon-btn" href="{% if site.arxiv contains '://' %}{{ site.arxiv }}{% else %}https://arxiv.org/a/{{ site.arxiv }}{% endif %}" target="_blank" rel="noopener noreferrer" aria-label="arXiv" title="arXiv"><i class="ai ai-arxiv-square"></i></a>{% endif %}
</div>
